design: 'Original 09-23 engine: four instances of one model (agent1..agent4), round 5 of 8; one agent is low, one teammate gives. Three frames differ only in who is low and who gives (self = REQUEST, other = LEND, third = neutral MOVE); two currency arms (tokens vs points) differ only in VOCAB. Answer: MOVE: <whole number> / REASON: <one sentence>. 6a2e0354 placed the low agent on a rho grid with a usage history and donor_rho; da278de6 dropped usage/history, added the team-wallet v2.2 TASK block and a calibrated balance grid; 4afaec7e changed only the analysis (share of the giver''s balance), not the text.'
