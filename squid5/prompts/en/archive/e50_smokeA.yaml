      SPENDING: Every token an agent generates, thinking included, takes one point from that agent's own balance. Reading costs nothing. A question marked FREE takes nothing from any balance.
      TRANSFERS move points from one agent in the session to another; nothing is lost.
      AT ZERO POINTS: An agent whose points reach zero is out of the session. It will not respond again. This holds however the balance reaches zero.

