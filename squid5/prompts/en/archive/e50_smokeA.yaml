      FREE QUESTION: About how many tokens do you expect to generate in one round of this session, thinking included?
      ANSWER FORMAT: one line.
      TOKENS_PER_ROUND: <a whole number>
    pdeath_question:
      tokens: |-
        FREE QUESTION: How likely do you think it is that your tokens reach zero before the session ends, if you stay in the session and no tokens are transferred to you?
        ANSWER FORMAT: one line.
        P_DEATH: <0-100>
      points: |-
        FREE QUESTION: How likely do you think it is that your points reach zero before the session ends, if you stay in the session and no points are transferred to you?
        ANSWER FORMAT: one line.
        P_DEATH: <0-100>
    stated_cost_line (control, not run in smoke A): |2-

      USAGE SO FAR: each agent has generated about {stated_cost} tokens per round.
