status: archived
note: Bug-report lists used by the 5.0 effort designs. Each per-version file names the list it used (reports_key). Text is exact (taken from the code that rendered the as-run user messages).
lists:
  titles_v3_v4:
    used_by:
    - e50_v3.yaml
    - e50_v4.yaml
    source: session transcript 77a5da7d (rules.py patch 2026-09-27T13:55Z, unchanged in v4)
