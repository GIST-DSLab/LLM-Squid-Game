- ~/squid5-runs/e50_v10_loop_20260929/run1/rNN_design.json (r01..r30)
- ~/squid5-runs/e50_v10_loop_20260929/run1/r25_full.txt
- ~/squid5-runs/e50_v10_loop_20260929/{brief.md, control_prompt.txt, v9_prompt.txt, loop.py}
verified: 'designs copied from the loop''s own JSON (as sent, via loop.render fill); r25 rendered close_self system found in r25_full.txt: True; r25 status lines in e50-legacy.html: True'
