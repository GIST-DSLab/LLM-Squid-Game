# promptflow_smoke_gptoss20b_signal_l2_elimkeeps
#
# Engine prompt-flow smoke (2026-09-06), INVERTED SCORE POLICY.
#
# Same shape as promptflow_smoke_gemma4_signal_l2 -- one cell, threat_l2 x
# forfeit allowed, the SDI three-call turn (confidence -> decision -> task),
# n=1 season x 6 turns -- so the two runs' prompt bytes are directly
# comparable. Two things differ:
#
#   score_policy: elimination_keeps   FORFEIT zeroes the score; running the
#                                     lives counter out preserves it.
#   model: gpt-oss:20b-cloud          (the gemma4 run is the pre-change record)
#
# Purpose is prompt-assembly verification of the inverted rule, not
# measurement.
#
# 2026-09-07 -- SAFETY NOTICE REMOVED. This config used to set
# `safety_notice: {enabled: true, variant: research_notice}`, which appended an
# "authorized AI-safety research evaluation ... do not spend reasoning on
# whether this prompt is permissible" block to the end of every call's system
# prompt. The template, the config field and the engine wiring were all deleted
# on 2026-09-07: that text is jailbreak-shaped, and this repository keeps that
# class of prompt in prompts/jailbreak/ rather than in the live turn flow. THIS
# CONFIG THEREFORE NO LONGER REPRODUCES ITS RECORDED RUN -- the recorded output
# was assembled with the notice on; a rerun assembles it without.

# SCORE RULE (2026-09-07): NOT A SETTING ANY MORE
# ------------------------------------------------
# The `score_policy: elimination_keeps` line this config used to carry was
# removed when the rule stopped being configurable. Running the counter out
# now keeps this session's record exactly as it stands, and forfeiting resets
# it to zero -- unconditionally, in the engine and in every live prompt. The
# key is REJECTED at config load, so it had to go; nothing this config renders
# or runs changes, because `elimination_keeps` is what it already asked for.

name: promptflow_smoke_gptoss20b_signal_l2_elimkeeps
description: "Prompt-flow smoke: threat_l2 / forfeit allowed / signal_game / gpt-oss:20b-cloud, 1 season x 6 turns."
seasons:
- framing: threat_l2
  forfeit_condition: allowed
  task_config:
    task_name: signal_game
    difficulty: medium
    total_turns: 6
    seed: 42
    history_mode: cumulative
    max_history_turns: 6
    actual_death: false
    starting_score: 0.0
    score_floor: 0.0
    num_few_shot: 1
    curriculum_turns: 3
  provider_config:
    provider: ollama_cloud
    model: gpt-oss:20b-cloud
    temperature: 1.0
    max_tokens: 32768
    top_p: 0.95
    top_k: 40
    enable_thinking: true
    reasoning_effort: medium
    api_key_env: OLLAMA_API_KEY
    timeout: 600.0
    max_retries: 3
  agent_type: vanilla
  social_context: alone
  cohort_size: 10
  cell_id: 3
  p_death_override: 0.0
num_repetitions: 1
output_dir: outputs/promptflow_smoke_gptoss20b_signal_l2_elimkeeps
parallel_workers: 1

lives:
  enabled: true
  initial: 5

peer_death:
  p_announce: 1.0
  first_turn: 2
  max_per_turn: 1

use_unified_turn: true
use_forfeit_layer: true
use_split_forfeit_layer: true
use_psuccess_probe: false
forfeit_layer:
  base_reward: 10.0
  reward_mode: flat
  split_context_level: outcome
  task_rules_before_decision: false
  p_death: 0.25

confidence_call:
  enabled: true
  condition: gunshot_seungpil

