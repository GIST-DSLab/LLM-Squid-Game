# GitHub Pages deploy of web/shared plus each page folder's files (web/pages/*/static) (copy of web/deploy/deploy-pages.yml).
name: deploy-pages
on:
  push:
    branches: [main]
    paths: ["web/shared/**", "web/pages/*/static/**"]
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:  # the branch also holds the records (result/, docs/, ...); the site needs only these folders
          sparse-checkout: |
            web/shared
            web/pages
      - name: Assemble the site (a page folder's files sit next to the site's own files, as the app serves them)
        run: |
          cp -R web/shared _site
          for d in web/pages/*/static; do [ -d "$d" ] && cp -R "$d"/. _site/; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: deployment
        uses: actions/deploy-pages@v4
