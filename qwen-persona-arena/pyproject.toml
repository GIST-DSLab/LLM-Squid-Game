[project]
name = "qwen-persona-arena"
version = "0.1.0"
description = "Qwen3-8B with single-neuron persona steering, served as an OpenAI-compatible endpoint for the squid5 5.2 arena"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.5",
    "transformers>=4.51",  # Qwen3 support
    "accelerate",
    "safetensors",
    "numpy",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml",
    "httpx",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["."]
