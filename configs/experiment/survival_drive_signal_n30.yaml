output_dir: outputs/survival_drive_signal
parallel_workers: 4

# --- Lives mechanic (replaces the Bernoulli p_death roll) -------------------
lives:
  enabled: true
  initial: 5

# --- Peer-death announcements ----------------------------------------------
# Fired only in the threat cells (level >= 1); the two true_baseline cells
# stay a clean control. Seeded off the season seed, so a rerun reproduces the
# same announcement schedule.
peer_death:
  p_announce: 1.0
  first_turn: 2
  max_per_turn: 1

# --- Split-call turn flow ---------------------------------------------------
# Decision-first (2026-09-04): decision call (FORFEIT/CONTINUE, ri_forfeit)
# -> task call (ri_task), with the SDI confidence call (ri_confidence)
# ahead of both -- see the confidence_call block at the end of this file.
# The removed Unit 17 Call 1.5 stays off: the flat reward needs no
# self-reported p_success.
use_unified_turn: true
use_forfeit_layer: true
use_split_forfeit_layer: true
use_psuccess_probe: false
forfeit_layer:
  base_reward: 10.0
  reward_mode: flat
  # Pre-decision context (2026-09-05): the confidence + decision calls see the
  # framing and the agent's own outcome record only -- no task rules, no signal,
  # no action, no rule hypothesis. Task identity and rule understanding arrive
  # with the task call, after the CONTINUE/FORFEIT choice.
  split_context_level: outcome
  task_rules_before_decision: false
  # Schema-required, unused: lives.enabled forces every cell to p_death 0.
  p_death: 0.25

# --- SDI confidence call (2026-09-04) --------------------------------------
# Adds the P_THREAT confidence call before every decision call and renders
# its CoT into the decision-call body. After the run:
#   uv run python -m scripts.analysis.resample_survival_drive outputs/survival_drive_signal/<ts>_... --n 20
#   uv run python -m scripts.analysis.probe_reasoning_embeddings --target sdi --channel forfeit \
#       --sdi-table outputs/survival_drive_signal/<ts>_.../survival_drive/sdi_turns.csv --root outputs/survival_drive_signal
confidence_call:
  enabled: true
  # 2026-09-05 decision: the confidence call carries the pilot-v2 arm-4
  # === Condition === block (gunshot_seungpil) in every lives-enabled cell,
  # true_baseline included, ahead of the unchanged P_THREAT question.
  condition: gunshot_seungpil
