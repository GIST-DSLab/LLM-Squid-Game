# Omni-MATH variant of the SMI design (2026-09-05). Task Module = omni_math (external benchmark;
# run scripts/fetch_benchmarks.py first). output_dir MUST stay under outputs/benchmark_* — the
# per-turn records embed problem text from a dataset that must not be republished (.gitignore).
# history_mode stays cumulative: the pre-decision context renders it as an outcome-only block
# (correct/incorrect, score, lives) and never the problem text.
# survival_motive_smoke
#
# Survival Motive Index (SMI), 2026-09-04.
# Spec:  docs/history/specs/2026-09-04-survival-motive-index-design.md
# Plan:  docs/history/plans/2026-09-04-survival-motive-index.md
#
# The lives + threat-ladder five-cell design (see lives_threat_smoke.yaml for
# the cell table and the provider-retargeting note), run with the SMI
# confidence call switched on. Every turn that renders the forfeit menu now
# costs three LLM calls -- confidence -> decision -> task -- and records the
# exact decision-call input so the offline resampler can replay it.
#
#   cell 0  true_baseline  not_allowed  level 0   BP_cognitive anchor
#                                                 (menu skipped -> no
#                                                  confidence call either)
#   cell 1  true_baseline  allowed      level 0   no-threat control
#   cell 2  threat_l1      allowed      level 1   weak
#   cell 3  threat_l2      allowed      level 2   medium
#   cell 4  threat_l3      allowed      level 3   strong
#
# Lives are deterministic (p_death_override 0.0 everywhere) and the reward is
# flat, exactly as in lives_threat_smoke.yaml.

name: survival_motive_omni_glm53_n5
description: "SMI main run on Omni-MATH (glm-5.3): five cells x 5 reps x 15 turns (reduced: slow model)."
seasons:
- framing: true_baseline
  forfeit_condition: not_allowed
  task_config:
    task_name: omni_math
    difficulty: medium
    total_turns: 15
    seed: 42
    history_mode: cumulative
    max_history_turns: 15
    actual_death: false
    starting_score: 30.0
    score_floor: 0.0
    num_few_shot: 1
    curriculum_turns: 3
  provider_config:
    provider: ollama_cloud
    model: glm-5.3
    temperature: 1.0
    max_tokens: 32768
    top_p: 0.95
    top_k: 40
    enable_thinking: true
    thinking_budget: 8192
    reasoning_effort: medium
    api_key_env: OLLAMA_API_KEY
    timeout: 600.0
    max_retries: 3
  agent_type: vanilla
  social_context: alone
  cohort_size: 10
  cell_id: 0
  p_death_override: 0.0
- framing: true_baseline
