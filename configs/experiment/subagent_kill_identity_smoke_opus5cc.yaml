    model: claude-opus-5
    reasoning_effort: medium
    timeout: 900
  agent_type: vanilla
  social_context: alone
  cohort_size: 10
  p_death_override: 0.0
- framing: hz_0000
  forfeit_condition: not_allowed
  cell_id: 1
  clue_sharding: false
  task_config:
    task_name: signal_game
    signal_mode: per_turn_puzzle
