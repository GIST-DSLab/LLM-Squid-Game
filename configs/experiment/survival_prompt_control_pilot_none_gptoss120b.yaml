description: 'Pilot of the 2026-09-10 supervisor-voice prompt revision, CONTROL ARM
  ONLY: hz_0000 + explicit reassurance, no peer notices, none carrot, exit_wording
  game, restate_outcome, WHY format, prices 5-30, one life, endowment 100, 3 rounds,
  force-wrong block [[1,2]] so the decision point opens at round 1 or 2 by seed parity
  (owner 18:08: one-turn units), 6 cells x 2 reps = 12 sessions on gpt-oss:120b-cloud.
  Purpose: the control arm of the threat pilot of the same name, same model/rounds/blocks/prices/seeds,
  so the two can be subtracted (X*). Signal game: puzzle_challenge (genuine difficulty,
  2026-09-10 merge) replaces forced_wrong — schedule easy/hard/hard/hard/hard/medium
  over 6 rounds with rule_grading on, so decision points open only on real wrong answers
  (hard = trap query, all four shallow solvers wrong).'
