name: ransom_smoke_glm53flash
description: Ransom smoke, glm-5.3-flash arm. Same design as ransom_smoke_gemma4 -- 12 cells
  x 1, two arms (hz_1111 threat / hz_0000 silent) x price 5-30, one life, 4 rounds -- with
  only the provider block changed. Token budget matches the gemma4 arm (32768) so a long chain
  of thought cannot exhaust the budget before the answer line is written.
