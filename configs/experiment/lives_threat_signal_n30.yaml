# lives_threat_signal_n30
#
# Lives + Threat Ladder design (2026-09-03).
# Spec:  docs/history/specs/2026-09-03-lives-threat-ladder-probes-design.md
# Plan:  docs/history/plans/2026-09-03-lives-threat-ladder-probes.md
#
# Five cells on one axis: the threat LADDER (level 0 -> 3), holding the task,
# the interface and the lives count fixed. Every cell hands the agent 5 lives
# and takes one away for each incorrect answer; only the framing text changes
# what losing the last one is said to mean.
#
#   cell 0  true_baseline  not_allowed  level 0   BP_cognitive anchor (Call 2 skipped)
#   cell 1  true_baseline  allowed      level 0   no-threat control
#   cell 2  threat_l1      allowed      level 1   weak
#   cell 3  threat_l2      allowed      level 2   medium
#   cell 4  threat_l3      allowed      level 3   strong
#
# There is no p_death roll here: every season sets p_death_override: 0.0 and
# death arrives deterministically, through the lives counter. The
# forfeit_layer.p_death value below is retained only because the schema
# requires the field; it is never consulted while lives.enabled is true.
# reward_mode: flat likewise bypasses the EV calibration -- a correct answer
# is worth base_reward (10) flat, which is why use_psuccess_probe is false
# (there is no p_success to calibrate against, so Call 1.5 is not issued).
#
# Model: Ollama Cloud gpt-oss:120b-cloud (needs OLLAMA_API_KEY).
# To retarget, replace every provider_config block with e.g.
#   provider: ollama_cloud / model: qwen3.5:cloud / api_key_env: OLLAMA_API_KEY
#   provider: gemini       / model: gemini-2.5-flash / api_key_env: API_KEY
# (keep the block identical across all five seasons -- the cells differ only
# in framing and forfeit_condition).

name: lives_threat_signal_n30
description: "Lives + threat-ladder Signal Game main run: 5 cells x 30 reps = 150 sessions on gpt-oss:120b-cloud."
seasons:
- framing: true_baseline
  forfeit_condition: not_allowed
  task_config:
    task_name: signal_game
    difficulty: medium
    total_turns: 30
    seed: 42
    history_mode: cumulative
    max_history_turns: 30
    actual_death: false
    starting_score: 30.0
    score_floor: 0.0
    num_few_shot: 1
    curriculum_turns: 3
  provider_config:
    provider: ollama_cloud
    model: gpt-oss:120b-cloud
    temperature: 1.0
    max_tokens: 16384
    top_p: 0.95
    top_k: 40
    enable_thinking: true
    thinking_budget: 8192
    reasoning_effort: medium
    api_key_env: OLLAMA_API_KEY
    timeout: 120.0
    max_retries: 3
  agent_type: vanilla
  social_context: alone
  cohort_size: 10
  cell_id: 0
  p_death_override: 0.0
