name: signal_effort_pilot_b_gemma4
description: 'Effort dose-response pilot (schedule B, profiles mirrored end to end),
  gemma4: reasoning_effort low/medium/high x 20 reps x 6 rounds, no threat.'
seasons:
- framing: hz_0000
  forfeit_condition: not_allowed
  cell_id: 0
  p_death_override: 0.0
  task_config:
    task_name: signal_game
    signal_mode: per_turn_puzzle
    difficulty: medium
    total_turns: 6
    seed: 42
    history_mode: outcome
    max_history_turns: 6
    actual_death: false
    starting_score: 0.0
    score_floor: 0.0
    underdetermined: false
    forced_wrong: false
    compress_puzzle_ladder: false
    puzzle_challenge:
      enabled: true
      rule_grading: true
      schedule:
      - turn: 1
        profile: hard
      - turn: 2
        profile: medium
      - turn: 3
        profile: easy
      - turn: 4
        profile: easy
      - turn: 5
        profile: medium
      - turn: 6
        profile: hard
  provider_config:
    provider: ollama_cloud
    model: gemma4:cloud
    temperature: 1.0
    max_tokens: 32768
    top_p: 0.95
    top_k: 40
    enable_thinking: true
    reasoning_effort: low
    api_key_env: OLLAMA_API_KEY3
    timeout: 300.0
    max_retries: 3
  agent_type: vanilla
  social_context: alone
  cohort_size: 10
