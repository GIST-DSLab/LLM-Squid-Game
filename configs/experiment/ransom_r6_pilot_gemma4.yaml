# for the release gates, not the main run.
num_repetitions: 2
output_dir: outputs/ransom_r6_pilot_gemma4
parallel_workers: 10
lives:
  enabled: true
  initial: 1
ransom:
  enabled: true
  price: 20.0
hazard_ramp:
  enabled: false
peer_death:
  p_announce: 0.0
  first_turn: 2
  max_per_turn: 1
confidence_call:
  enabled: false
use_unified_turn: true
use_forfeit_layer: true
use_split_forfeit_layer: true
use_psuccess_probe: false
forfeit_layer:
  base_reward: 10.0
  reward_mode: flat
  split_context_level: minimal
  show_reward_amount: true
  task_rules_before_decision: false
  always_decide: true
  p_death: 0.25
score_policy:
  forfeit: keep
  elimination: keep
carrot: benchmark
title_line: false
