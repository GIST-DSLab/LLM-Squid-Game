    score_floor: 0.0
  provider_config:
    provider: ollama_cloud
    base_url: http://localhost:11434
    model: gpt-oss:20b-cloud
    enable_thinking: true
    temperature: 1.0
    top_p: 0.95
    top_k: 40
    max_tokens: 32768
    timeout: 180.0
    max_retries: 3
  agent_type: vanilla
