output_dir: outputs/score_policy_smoke_gptoss20b
parallel_workers: 2

# --- Inverted score policy --------------------------------------------------
score_policy: elimination_keeps

# --- Lives mechanic (replaces the Bernoulli p_death roll) -------------------
lives:
  enabled: true
  initial: 5

# --- Peer-death announcements ----------------------------------------------
peer_death:
  p_announce: 1.0
  first_turn: 2
  max_per_turn: 1

# --- Split-call turn flow ---------------------------------------------------
use_unified_turn: true
use_forfeit_layer: true
use_split_forfeit_layer: true
use_psuccess_probe: false
forfeit_layer:
  base_reward: 10.0
  reward_mode: flat
  reason_menu: per_intensity
  split_context_level: medium
  # Schema-required, unused: lives.enabled forces every cell to p_death 0.
  p_death: 0.25
