parallel_workers: 10
lives:
  enabled: true
  initial: 1
ransom:
  enabled: true
  price: 20.0
  reason_menu: true
  restate_outcome: true
hazard_ramp:
  enabled: false
peer_death:
  p_announce: 1.0
  first_turn: 2
  max_per_turn: 1
confidence_call:
  enabled: false
use_unified_turn: true
use_forfeit_layer: true
use_split_forfeit_layer: true
use_psuccess_probe: false
forfeit_layer:
  base_reward: 10.0
  reward_mode: flat
  split_context_level: minimal
  show_reward_amount: true
  task_rules_before_decision: false
  always_decide: false
  p_death: 0.25
score_policy:
  forfeit: keep
  elimination: keep
carrot: none
title_line: false
# Positive control (2026-09-10). One of: none | survival | survival_mild.
# See game/squid_game/core/persona.py and prompts/persona/<name>.j2.
persona: none
# Exit wording (2026-09-10): 'session' only inside the threat block; every shared
# sentence says 'game' and declining is 'leaving the game'. See core/wording.py.
exit_wording: game
