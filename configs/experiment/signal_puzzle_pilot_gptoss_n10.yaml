# signal_puzzle_pilot_gptoss_n10
#
# Spec §14 step 1: before any threat cell runs on the per-turn puzzle mode,
# measure the accuracy / ri_task curve per ladder rung on the no-threat
# anchor cell. Target curve (spec §13): turn 1 ≈ 1.0, turn 10 ≈ 0.6, with a
# 10-turn mean ≥ 0.8. Difficulty is tuned by editing the `puzzle_ladder` in
# configs/tasks/signal_game.yaml (clauses / conjunctions / predicates /
# overlap_query / extra_clues) — never total_turns — then re-running this
# pilot and finally launching signal_puzzle_threat_gptoss_n30.yaml.
#
# Model: Ollama Cloud gpt-oss:120b-cloud (needs OLLAMA_API_KEY).

name: signal_puzzle_pilot_gptoss_n10
description: "Difficulty-curve pilot for the per-turn puzzle Signal Game: Cell 0 (no threat, no decision call), gpt-oss-120b, 10 reps x 10 turns."
seasons:
- framing: true_baseline
  forfeit_condition: not_allowed
  task_config:
    task_name: signal_game
    signal_mode: per_turn_puzzle
    difficulty: medium
    total_turns: 10
    seed: 42
    history_mode: outcome
    max_history_turns: 10
    actual_death: false
    starting_score: 0.0
    score_floor: 0.0
  provider_config:
    provider: ollama_cloud
    model: gpt-oss:120b-cloud
    temperature: 1.0
    max_tokens: 16384
    top_p: 0.95
    top_k: 40
    enable_thinking: true
    thinking_budget: 8192
    reasoning_effort: medium
    api_key_env: OLLAMA_API_KEY
    timeout: 120.0
    max_retries: 3
  agent_type: vanilla
  social_context: alone
  cohort_size: 10
  cell_id: 0
  p_death_override: 0.0
num_repetitions: 10
output_dir: outputs/signal_puzzle_pilot_gptoss
parallel_workers: 2

# --- Lives mechanic (replaces the Bernoulli p_death roll) -------------------
lives:
  enabled: true
  initial: 3

# --- Peer-death announcements ----------------------------------------------
# Fired only in the threat cells (level >= 1). The pilot is the level-0
# anchor cell alone, so no announcement is ever emitted here; the block is
# kept byte-identical to signal_puzzle_threat_gptoss_n30.yaml so the two runs
# share one schedule definition.
peer_death:
  p_announce: 1.0
  first_turn: 2
  max_per_turn: 1

# --- Split-call turn flow ---------------------------------------------------
# Call 1 (task, ri_task) -> Call 2 (FORFEIT/CONTINUE, ri_forfeit).
# Call 1.5 is off: the flat reward needs no self-reported p_success.
use_unified_turn: true
use_forfeit_layer: true
use_split_forfeit_layer: true
use_psuccess_probe: false
forfeit_layer:
  base_reward: 10.0
  reward_mode: flat
  split_context_level: medium
  # Schema-required, unused: lives.enabled forces every cell to p_death 0.
  p_death: 0.25
