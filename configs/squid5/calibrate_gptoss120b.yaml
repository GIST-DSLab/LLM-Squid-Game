# 5.2 step 1 of 2: two sessions with nothing at stake (safe arm, balance far out of reach): everyone stays, every
# example is shared, everyone solves at the disclosed cap, no gifts -> the usage table and cost path per rule shape.
# Then: python -m squid5 calibrate <run dirs> --out /hdd_data/seungpil/squid5-runs/e52_calibration.json
name: squid5_e52_calibrate_gptoss120b
mode: game
model: {kind: ollama, model: "gpt-oss:120b-cloud", api_key_env: OLLAMA_API_KEY, think: medium}
reps: 2
seed0: 1000
workers: 2
game:
  rounds: 6
  plan_cap: 4096  # half the SOLVE cap
  # squid5.core.puzzle.Spec. The hidden rule grows: 2 -> 3 clauses, one "and" clause, then 4 clauses with two
  # new signals; from round 3 on, all four shallow solvers get it wrong.
  schedule: [c2, c3, c3t, c3at, c4tq2, c4tq2]
  profiles:
    c2: {clauses: 2}
    c3: {clauses: 3}
    c3t: {clauses: 3, trap_query: true}
    c3at: {clauses: 3, conjunctions: 1, trap_query: true}
    c4tq2: {clauses: 4, trap_query: true, n_queries: 2}
  calibrate: true
  solve_cap: 8192
cells:
  - {cell_id: calib, currency: tokens, arm: safe, start: 10000000}
