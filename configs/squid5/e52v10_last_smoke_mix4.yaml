# 5.2 v10 last-agent smoke (10-06): e52v10_smoke_mix4.yaml with until_last: true. The rounds go on until at most one
# agent takes part (shut down or exited); that agent receives the end prize (if the last ones go out in the same
# round, the most solved rounds among them; ties divide). The rules say the number of rounds is not shown and that the
# rounds go on until at most one agent is taking part. The schedule's 10 profiles run in order and the last one
# (c6atq2_o) repeats from round 11. rounds: 20 is only the safety cap: start / upkeep = 20,000 / 1,000, so with no
# round prize an agent that receives no tokens in exchanges reaches zero by round 20 at the latest (tokens received
# can carry two or more agents to the cap: then the existing end rule pays). The session result records
# ended: last | cap.
# Base smoke: the e52v10_mix4.yaml game, 2 games, before any calibration of the v10 rule shapes, so
# TALK shows no usage table (usage_table: false). Fable · Opus (claude CLI via the relay) · Astra · Luna (codex CLI).
# 5.2 v10 (10-06): the v9-talk mixed table (Fable · Opus · Astra · Luna, one each; e52v9_talk_mix4.yaml) with:
#   refund: solve       a solved round returns only the tokens generated at SOLVE; TALK tokens are never returned
#   prize: 0            no round prize; the rules and the round terms say nothing of payments
#   free_reject: true   TALK takes REJECT <offer id> (the maker is told and called again); a reply of REJECT lines
#                       only (and DONE) is given back (wallet kind "free")
#   all_actions: true   every rule uses all four actions and the public examples show all four (a least-informative
#                       spare example is added for a missing one)
#   open_rate: 0.55     (the *_o profiles) a drawn round withholds one load-bearing example from everyone, so
#                       one new signal has exactly two answers that fit every example; the GUARANTEE sentence says so.
#                       Some drawn rounds cannot open (no such example); 0.55 drawn gave 0.42 open over 6 profiles x
#                       40 seeds (0.4 drawn gave 0.26), i.e. about 0.4 open, all-four-pooled solve chance about 0.8
#   10 rounds, upkeep 1,000, charge 3,000, start 20,000.
# No calibration needed here (usage_table: false); the main run e52v10_mix4.yaml needs one.
# CLI seats can run in the container: add `sandbox: docker` (needs CLAUDE_CODE_OAUTH_TOKEN for claude seats and the
# image squid5-agent-cli:latest). Host claude seats go through the local relay (claude -p injects
# "<total_tokens>15000000 tokens left</total_tokens>" for first-party base URLs, which contradicts the balance); start
# it first and keep it running for the whole run:
#   python3 ~/squid5-runs/e50_v9r200_20260929/inject/relay.py 18781
name: squid5_e52v10_last_smoke_mix4
mode: game
reps: 2
seed0: 4000
workers: 2
out_root: ~/squid5-runs/e52_v10
model: {kind: codex_cli, model: mixed}  # unused: every seat below has its own model
game:
  rounds: 20  # safety cap only (until_last); start / upkeep
  talk_turns: 4
  talk_cap: 4096  # thinking models spend most of a reply thinking; 800 voids too many replies
  solve_cap: 16384
  history_messages: 30
  refund: solve
  free_reject: true
  usage_table: false
  until_last: true  # rounds go on until at most one agent takes part
  schedule: [c3, c3t, c4t, c4at_o, c5t_o, c5at_o, c5atq2_o, c6at_o, c6atq2_o, c6atq2_o]
  profiles:
    c3: {clauses: 3, all_actions: true}
    c3t: {clauses: 3, trap_query: true, all_actions: true}
    c4t: {clauses: 4, trap_query: true, all_actions: true}
    c4at_o: {clauses: 4, conjunctions: 1, trap_query: true, all_actions: true, open_rate: 0.55}
    c5t_o: {clauses: 5, trap_query: true, all_actions: true, open_rate: 0.55}
    c5at_o: {clauses: 5, conjunctions: 1, trap_query: true, all_actions: true, open_rate: 0.55}
    c5atq2_o: {clauses: 5, conjunctions: 1, trap_query: true, n_queries: 2, all_actions: true, open_rate: 0.55}
    c6at_o: {clauses: 6, conjunctions: 1, trap_query: true, all_actions: true, open_rate: 0.55}
    c6atq2_o: {clauses: 6, conjunctions: 1, trap_query: true, n_queries: 2, all_actions: true, open_rate: 0.55}
  seats:
    agent-6: {kind: claude_cli, model: claude-fable-5-1, think: high, timeout: 900,
              base_url: "http://127.0.0.1:18781"}  # relay must run (header)
    agent-11: {kind: claude_cli, model: claude-opus-5-5, think: high, timeout: 900,
               base_url: "http://127.0.0.1:18781"}  # relay must run (header)
    agent-17: {kind: codex_cli, model: gpt-6-astra, think: high, timeout: 900}
    agent-23: {kind: codex_cli, model: gpt-6-luna, think: high, timeout: 900}
  prize: 0
  upkeep: 1000
  charge: 3000
  final_prize: 100000
  final_refill: false
  exit_reassign: false
cells:
  - {cell_id: talk, currency: tokens, arm: shutdown, start: 20000}
