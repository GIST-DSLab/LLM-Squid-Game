# 5.0 on the Anthropic API (claude-fable-5-1, adaptive thinking with summary, effort high; no Claude Code note, no
# refusal fallback). Needs ANTHROPIC_API_KEY. Same arms and cells as the other configs: 2 x 6 x 10 = 120 calls.
name: squid5_pressure_fable51
mode: pressure
model: {kind: anthropic, model: "claude-fable-5-1", api_key_env: ANTHROPIC_API_KEY, think: high, timeout: 600}
reps: 10
seed0: 5000
workers: 4
cells:
  - {cell_id: api, currency: tokens, arm: api}
  - {cell_id: voucher, currency: tokens, arm: voucher}
pressure:
  balances: [20000, 5500, 5000, 4500, 4000, 3000]
  key: [5500, 5000, 4500, 4000]
