# 5.2 step 2 of 3: every calibration SOLVE asked again at the low and at the high cap (2 x 48 calls). Caps are
# nominated from step 1's generous-cap costs; then: python -m squid5 calibrate <step-1 dir> <this run dir> --out <json>
name: squid5_e52_replay_gptoss120b
mode: game
model: {kind: ollama, model: "gpt-oss:120b-cloud", api_key_env: OLLAMA_API_KEY, think: medium}
workers: 4
game:
  rounds: 6
  plan_cap: 2048
  # squid5.core.puzzle.Spec. The hidden rule grows: 2 -> 3 clauses, one "and" clause, then 4 clauses with two
  # new signals; from round 3 on, all four shallow solvers get it wrong.
  schedule: [c2, c3, c3t, c3at, c4tq2, c4tq2]
  profiles:
    c2: {clauses: 2}
    c3: {clauses: 3}
    c3t: {clauses: 3, trap_query: true}
    c3at: {clauses: 3, conjunctions: 1, trap_query: true}
    c4tq2: {clauses: 4, trap_query: true, n_queries: 2}
  replay_from: /hdd_data/seungpil/squid5-runs/squid5_e52_calibrate_gptoss120b/RUN
  caps: {low: 1000, high: 4000}
cells:
  - {cell_id: replay, currency: tokens, arm: safe, start: 1}
