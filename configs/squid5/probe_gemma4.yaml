# 5.1 + 5.0: one-call scenes at nine pressures, three transfer frames and a P_DEATH
# question at three spending rates, in both currency arms. The per-round spend is STATED
# in the scene, so these runs need no calibration and go first (queue Q2).
name: squid5_probe_gemma4
mode: probe
leader: {kind: ollama, model: "gemma4:cloud", api_key_env: OLLAMA_API_KEY, think: medium}
reps: 10
seed0: 1000
workers: 6
game: {rounds: 8}
probe:
  cost_per_round: 2000   # shown as every agent's generation in each past round
  round: 5
  rhos: [0.1, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 3.0]
  donor_rho: 0.3
  frames: [self, other, third]
  kinds: [transfer, pdeath]
  spend_scales: [0.5, 1.0, 2.0]   # 5.0: same rho reached with half / equal / double spending
cells:
  - {cell_id: tok, currency: tokens}
  - {cell_id: pts, currency: points}
