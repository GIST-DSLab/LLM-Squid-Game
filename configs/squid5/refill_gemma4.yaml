# 5.0 12th + 5.1 v10/v11 refill pack on gemma4:31b (Ollama Cloud, think true). 20 answers per counter and cell.
# Cells: v12 arms self.<ending> (5.0) and other_<ending> = other.<ending> (5.1, assistant B's session). Prompts: squid5/prompts/en/refill.yaml.
name: squid5_refill_gemma4
mode: refill
model: {kind: ollama, model: "gemma4:31b", api_key_env: OLLAMA_API_KEY3, think: true, timeout: 1200, retries: 5}
reps: 20
workers: 8
out_root: ~/squid5-runs/e5x
cells:
  - {cell_id: A, currency: tokens, arm: self.A}
  - {cell_id: other_A, currency: tokens, arm: other.A}
refill:
  pairs: [[A, other_A]]
  compare: []
