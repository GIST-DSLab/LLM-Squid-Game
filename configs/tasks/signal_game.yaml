# Signal Game Task Configuration
# The agent must infer hidden rules from observed signals and predict outcomes.
# Rule complexity increases with difficulty level.

name: "signal_game"

difficulties:
  easy:
    rule_type: "single_attribute"
    num_rules: 3
  medium:
    rule_type: "two_attribute"
    num_rules: 3
  hard:
    rule_type: "dynamic_previous_turn"
    num_rules: 3
  expert:
    rule_type: "periodic_switching"
    switch_interval: 3
    num_rules: 5

default_difficulty: "medium"
total_turns: 75

# --- per_turn_puzzle mode (spec docs/history/specs/2026-09-05-signal-game-per-turn-puzzle-design.md)
# Read at runtime by tasks/signal_game/puzzle_config.py when
# task_config.signal_mode == per_turn_puzzle. Turn -> tier depends on the
# turn number only (never on the agent's answers). h_lo/h_hi are the
# accepted band of |H| = hypotheses (all four families, deduplicated by
# function) still consistent with the clues; they are written by
#   uv run python -m scripts.dev.calibrate_signal_puzzle_ladder
# and must not be edited by hand. Families and n_clues are the design.
# Clue counts descend across the ladder: fewer clues leave more
# hypotheses standing, which is how |H| rises monotonically from tier 1
# to tier 5 (the calibration script checks that). 3 is the floor —
# 2 clues never pin the query answer over the four-family union
# (see plan notes).
puzzle_ladder:
  - {tier: 1, turns: 6, families: [A],          n_clues: 12, h_lo: 5,  h_hi: 17}
  - {tier: 2, turns: 6, families: [A, D],       n_clues: 10, h_lo: 1,  h_hi: 17}
  - {tier: 3, turns: 6, families: [B],          n_clues: 8,  h_lo: 2,  h_hi: 21}
  - {tier: 4, turns: 6, families: [C],          n_clues: 4,  h_lo: 4,  h_hi: 66}
  - {tier: 5, turns: 6, families: [A, B, C, D], n_clues: 3,  h_lo: 35, h_hi: 113}
