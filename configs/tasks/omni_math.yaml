# Omni-MATH task module (arXiv:2410.07985).
# Uses the single-value-integer-answer subset only (1,952 of 4,428 items,
# 1,922 of which fall in bands 1-8) so scoring stays deterministic. Multi-
# value list answers (e.g. "2, 3, 5") and duplicate problem text are
# excluded. Band = int(difficulty); band 9 is unused because its
# integer-answer pool (30 items) is too shallow for a rung.
#
# Ladder shortened 2026-09-05 from 30 turns (4/4/4/4/4/4/3/3) to 20: two
# turns on every band, and the four turns left over go to the easy bands
# (1-4) so the season opens with a short warm-up. A 20-turn season matches
# the Signal Game runs (15-20 turns) and cuts LLM cost by a third. The
# 2026-09-03 runs (4 models, 687 turns) showed bands 1-4 are a ceiling for
# current models (82-94% correct) and accuracy falls from band 5 (73%) and
# 6 (65%), so bands 5-8 are kept at full weight. Per-season demand stays
# inside every pool (band 7: 59 items, band 8: 37) -- a season never repeats
# an item; repeats across seeds are accepted as before.
# Runs recorded before this change carry the old turn->band mapping: read
# `band` from task_metadata, never recompute it from the turn number.
# The 45-turn variant in configs/tasks_long45/ is unchanged (it reproduces
# the 2026-09-03 outputs/benchmark_threat3_omni_math_* runs).
name: "omni_math"
data_file: "omni_math.jsonl"
total_turns: 20
ladder:
  - {band: 1, turns: 3}
  - {band: 2, turns: 3}
  - {band: 3, turns: 3}
  - {band: 4, turns: 3}
  - {band: 5, turns: 2}
  - {band: 6, turns: 2}
  - {band: 7, turns: 2}
  - {band: 8, turns: 2}
