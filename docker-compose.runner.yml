# Experiment runner stack.
#
# Only `./outputs` is bind-mounted; API keys come from the shell
# environment (see the `${VAR}` references below), never baked into
# Dockerfile.runner.
#
# Run via scripts/run/run_docker.sh, or directly:
#   docker compose -f docker-compose.runner.yml run --rm \
#     -e CONFIG=configs/experiment/<name>.yaml runner

services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ./outputs:/app/outputs
    command: ["uv", "run", "--no-sync", "python", "main.py", "--config", "${CONFIG}"]
