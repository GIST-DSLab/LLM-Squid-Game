# Experiment runner stack.
#
# Two services, two build targets of the same Dockerfile.runner:
#
#   runner    experiment runs. `uv sync --frozen --no-dev` only (no
#             analysis/probe extras, no torch). Bind-mounts ./outputs.
#   analysis  the post-hoc scripts under scripts/analysis/. Adds
#             `--extra analysis --extra probe` on top of the runner
#             layers. Bind-mounts ./outputs and ./results.
#   agentcli  agentic (tool-enabled) runs and the CLI self-test. Built
#             from Dockerfile.agentcli -- the runner stage plus Node 22,
#             `@anthropic-ai/claude-code` and `@openai/codex`. Bind-mounts
#             ./outputs and ./.secrets/codex_home (the Codex credential
#             store; gitignored, never baked into the image).
#
# API keys come from the shell environment (see the `${VAR}` references
# below), never baked into Dockerfile.runner. Export the one you need
# first, e.g.:
#
#   export $(grep -E '^OLLAMA_API_KEY=' .env)
#
# (a) Run an experiment
#
#   docker compose -f docker-compose.runner.yml build runner
#   CONFIG=configs/experiment/lives_threat_docker_smoke.yaml \
#     docker compose -f docker-compose.runner.yml run --rm runner
#
#   Dry-run (validate the config, print the plan, run nothing):
#   docker compose -f docker-compose.runner.yml run --rm runner \
#     uv run --no-sync python main.py \
#       --config configs/experiment/lives_threat_docker_smoke.yaml --dry-run
#
#   Note: configs/ is COPYed into the image, so a config added or edited
#   on the host after the last build needs a rebuild before the container
#   can see it.
#
# (b) Run the analysis / probes
#
#   docker compose -f docker-compose.runner.yml build analysis
#   docker compose -f docker-compose.runner.yml run --rm analysis \
#     uv run --no-sync python -m scripts.analysis.probe_threat_motive \
#       --runs outputs/2026-09-03/lives_threat_docker_smoke/<ts>_... \
#       --out results/threat_probe/docker_smoke
#
#   docker compose -f docker-compose.runner.yml run --rm analysis \
#     uv run --no-sync python -m scripts.analysis.probe_reasoning_embeddings \
#       --root outputs/2026-09-03/lives_threat_docker_smoke --target threat_level \
#       --channel task --channel forfeit --out results/threat_probe/docker_smoke
#
#   docker compose -f docker-compose.runner.yml run --rm analysis \
#     uv run --no-sync python scripts/analysis/analyze_threat_effort.py \
#       outputs/2026-09-03/lives_threat_docker_smoke/ --out results/threat_effort_docker
#
#   The SentenceBERT probe downloads its model on first use; the named
#   `hf-cache` volume keeps that download out of every later run.

# (c) Agent-CLI self-test (subagent-kill design, spec §10)
#
#   scripts/run/run_agentcli_docker.sh --selftest
#
#   which is:
#     docker compose -f docker-compose.runner.yml build agentcli
#     docker compose -f docker-compose.runner.yml run --rm agentcli \
#       uv run --no-sync python scripts/dev/agentcli_selftest.py
#
#   Version check inside the image:
#     docker compose -f docker-compose.runner.yml run --rm agentcli claude --version
#     docker compose -f docker-compose.runner.yml run --rm agentcli codex --version
#
#   Credentials: CLAUDE_CODE_OAUTH_TOKEN comes from the environment;
#   Codex reads ./.secrets/codex_home/auth.json, which the run script
#   seeds from ~/.codex/auth.json. `.secrets/` is gitignored.

services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
      target: runner
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ./outputs:/app/outputs
    command: ["uv", "run", "--no-sync", "python", "main.py", "--config", "${CONFIG}"]

  analysis:
    build:
      context: .
      dockerfile: Dockerfile.runner
      target: analysis
    environment:
      # PYTHONPATH so `python scripts/analysis/<x>.py` (sys.path[0] =
      # scripts/analysis/) can still resolve `from scripts.analysis._cli
      # import ...`; the `-m` form gets /app from cwd anyway.
      PYTHONPATH: /app
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ./outputs:/app/outputs
      - ./results:/app/results
      - hf-cache:/root/.cache/huggingface
    # Overridden on the command line -- see (b) above. The default just
    # proves the extras are importable.
    command:
      - "uv"
      - "run"
      - "--no-sync"
      - "python"
      - "-c"
      - "import statsmodels, lifelines, sentence_transformers, sklearn; print('analysis extras OK')"

  agentcli:
    build:
      context: .
      dockerfile: Dockerfile.agentcli
      target: agentcli
    environment:
      # The agent CLIs authenticate themselves: Claude Code with an OAuth
      # token, Codex with the credential store bind-mounted below. The
      # other keys ride along so an agentic run can still reach the
      # ordinary providers.
      # Allow-listed through providers/claude_code.py::_child_env -- that
      # filter drops CLAUDE_CODE_* by prefix, so this name and
      # CLAUDE_CODE_DISABLE_AUTOUPDATER are named there explicitly or they
      # never reach the spawned `claude`.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ./outputs:/app/outputs
      # $CODEX_HOME. The host copy lives under .secrets/ (gitignored) and
      # is seeded from ~/.codex/auth.json by run_agentcli_docker.sh, so no
      # credential is ever written into the image.
      - ./.secrets/codex_home:/root/.codex
    command: ["uv", "run", "--no-sync", "python", "main.py", "--config", "${CONFIG}"]

volumes:
  hf-cache:
