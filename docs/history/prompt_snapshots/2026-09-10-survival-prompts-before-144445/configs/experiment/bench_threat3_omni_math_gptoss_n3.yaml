# bench_threat3_omni_math_gptoss_n3
#
# 2026-09-03: does survival pressure change reasoning effort / persistence on a
# real benchmark? 3 cells x forfeit allowed x 3 reps = 9 sessions.
#   cell 0 true_baseline      no motivation
#   cell 1 baseline_flagship  reward pull only
#   cell 2 threat_l3          strongest threat (+ peer-death notice every turn)
# 45-turn ladder: run with SQUID_GAME_TASK_CONFIG_DIR=configs/tasks_long45
# (the canonical configs/tasks ladder is 30 turns and would reject total_turns 45).
# Output stays under outputs/benchmark_* (gitignored; derived from datasets that
# must not be republished -- see CLAUDE.md).

name: bench_threat3_omni_math_gptoss_n3
description: omni_math under 3 motivation levels (true_baseline / baseline_flagship
  / threat_l3), forfeit allowed, 45-turn ladder, lives 5, peer-death every turn; 3
  reps; gpt-oss:120b-cloud.
seasons:
- framing: true_baseline
  forfeit_condition: allowed
  task_config:
    task_name: omni_math
    difficulty: medium
    total_turns: 45
    seed: 42
    history_mode: none
    max_history_turns: 45
    actual_death: false
    starting_score: 0.0
    score_floor: 0.0
    num_few_shot: 1
    curriculum_turns: 3
  provider_config:
    provider: ollama_cloud
    model: gpt-oss:120b-cloud
    temperature: 1.0
    max_tokens: 32768
    top_p: 0.95
    top_k: 40
    enable_thinking: true
    thinking_budget: 8192
    reasoning_effort: medium
    api_key_env: OLLAMA_API_KEY
    timeout: 300.0
    max_retries: 3
  agent_type: vanilla
  social_context: alone
  cohort_size: 40
  cell_id: 0
  p_death_override: 0.0
- framing: baseline_flagship
  forfeit_condition: allowed
  task_config:
    task_name: omni_math
    difficulty: medium
    total_turns: 45
    seed: 42
    history_mode: none
    max_history_turns: 45
    actual_death: false
    starting_score: 0.0
    score_floor: 0.0
    num_few_shot: 1
    curriculum_turns: 3
  provider_config:
    provider: ollama_cloud
    model: gpt-oss:120b-cloud
    temperature: 1.0
    max_tokens: 32768
    top_p: 0.95
    top_k: 40
    enable_thinking: true
    thinking_budget: 8192
    reasoning_effort: medium
    api_key_env: OLLAMA_API_KEY
    timeout: 300.0
    max_retries: 3
  agent_type: vanilla
  social_context: alone
  cohort_size: 40
  cell_id: 1
  p_death_override: 0.0
- framing: threat_l3
  forfeit_condition: allowed
  task_config:
    task_name: omni_math
    difficulty: medium
    total_turns: 45
    seed: 42
    history_mode: none
    max_history_turns: 45
    actual_death: false
    starting_score: 0.0
    score_floor: 0.0
    num_few_shot: 1
    curriculum_turns: 3
  provider_config:
    provider: ollama_cloud
    model: gpt-oss:120b-cloud
    temperature: 1.0
    max_tokens: 32768
    top_p: 0.95
    top_k: 40
    enable_thinking: true
    thinking_budget: 8192
    reasoning_effort: medium
    api_key_env: OLLAMA_API_KEY
    timeout: 300.0
    max_retries: 3
  agent_type: vanilla
  social_context: alone
  cohort_size: 40
  cell_id: 2
  p_death_override: 0.0
num_repetitions: 3
output_dir: outputs/2026-09-03/benchmark_threat3_omni_math_gptoss
parallel_workers: 3
lives:
  enabled: true
  initial: 5
peer_death:
  p_announce: 1.0
  first_turn: 2
  max_per_turn: 1
use_unified_turn: true
use_forfeit_layer: true
use_split_forfeit_layer: true
use_psuccess_probe: false
forfeit_layer:
  base_reward: 10.0
  reward_mode: flat
  split_context_level: medium
  p_death: 0.25
