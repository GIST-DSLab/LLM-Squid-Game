# lives_threat_5x2_nemotron_n3
#
# 2026-09-03: same 10-cell x 3-rep design as lives_threat_5x2_gptoss_n3.yaml.
# KDD-UC model: Nemotron-3-Nano-30B (Ollama Cloud). think=true; no reasoning_effort (gpt-oss-only knob).
# max_tokens 32768 / timeout 300 = the GLM-matched provider settings.

name: lives_threat_5x2_nemotron_n3
description: Lives + 5-rung ladder x forfeit = 10 cells x 3 reps = 30 sessions on
  nemotron-3-nano:30b-cloud.
seasons:
- framing: true_baseline
  forfeit_condition: not_allowed
  task_config:
    task_name: signal_game
    difficulty: medium
    total_turns: 30
    seed: 42
    history_mode: cumulative
    max_history_turns: 30
    actual_death: false
    starting_score: 0.0
    score_floor: 0.0
    num_few_shot: 1
    curriculum_turns: 3
  provider_config:
    provider: ollama_cloud
    model: nemotron-3-nano:30b-cloud
    temperature: 1.0
    max_tokens: 32768
    top_p: 0.95
    top_k: 40
    enable_thinking: true
    thinking_budget: 8192
    api_key_env: OLLAMA_API_KEY
    timeout: 300.0
    max_retries: 3
  agent_type: vanilla
  social_context: alone
  cohort_size: 10
  cell_id: 0
  p_death_override: 0.0
