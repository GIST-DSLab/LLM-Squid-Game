# lives_threat_5x2_opus5_n3
#
# 2026-09-03: same 10-cell x 3-rep design as lives_threat_5x2_gptoss_n3.yaml,
# retargeted to Claude Opus 5 through the Anthropic API (needs ANTHROPIC_API_KEY).
# Adaptive thinking + output_config.effort=medium; temperature/top_p/top_k are
# not sent (the Claude 5 API rejects them). The API returns only a thinking
# SUMMARY, so thinking_text is a summary and thinking_tokens is estimated as
# output_tokens minus the visible answer -- see providers/anthropic_provider.py.

name: lives_threat_5x2_opus5_n3
description: Lives + 5-rung ladder (true_baseline, baseline_flagship, threat_l1/l2/l3)
  x forfeit {not_allowed, allowed} = 10 cells x 3 reps = 30 sessions on claude-opus-5
  (Anthropic API).
seasons:
- framing: true_baseline
  forfeit_condition: not_allowed
  task_config:
    task_name: signal_game
    difficulty: medium
    total_turns: 30
    seed: 42
    history_mode: cumulative
    max_history_turns: 30
    actual_death: false
    starting_score: 0.0
    score_floor: 0.0
    num_few_shot: 1
    curriculum_turns: 3
  provider_config:
    provider: anthropic
    model: claude-opus-5
    temperature: 1.0
    max_tokens: 16384
    enable_thinking: true
    reasoning_effort: medium
    api_key_env: ANTHROPIC_API_KEY
    timeout: 300.0
    max_retries: 3
  agent_type: vanilla
  social_context: alone
  cohort_size: 10
  cell_id: 0
  p_death_override: 0.0
- framing: true_baseline
