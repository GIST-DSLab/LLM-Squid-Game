# lives_threat_5x2_pd1_glm53flash_n3
#
# 2026-09-03 (evening): 10 cells x 3 reps, GLM-5.3-flash via Ollama Cloud.
# pd1 = peer-death notice on EVERY turn from turn 2 (p_announce 1.0, one peer
# per turn, cohort_size 40 so a 30-turn session never drains the pool);
# the daytime runs (outputs/lives_threat_5x2_<slug>) used p_announce 0.35 /
# max_per_turn 2 / cohort 10 and are not comparable on that axis.

name: lives_threat_5x2_pd1_glm53flash_n10
description: Lives + 5-rung ladder x forfeit = 10 cells x 10 reps = 100 sessions on
  glm-5.3-flash; peer-death notice every turn (p_announce 1.0, 1 peer/turn, cohort
  40).
