  points), so both arms paid above the ceiling (21/21 vs 18/21) and X* was not
  identified. Here every shared sentence says "game" and declining is "leaving the
  game"; the word "session" survives only inside hz_1111''s threat block, which is the
  one block the arms differ in. Same persona: survival, same 12 cells x 6 reps, own_prize
  carrot, prices 5-30, one life, endowment 100, forced-wrong blocks [[2,3],[4,5]].'
