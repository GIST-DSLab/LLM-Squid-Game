ect x="850" y="553" width="5" height="74" rx="2" fill="#269278"/><text x="875" y="567" font-size="23" font-weight="700" fill="#17243b">Arena Verifier</text><text x="875" y="597" font-size="18" font-weight="400" fill="#465871">독립 검증·허점 공격</text><text x="875" y="624" font-size="14" font-weight="400" fill="#63758d">@arena-verifier</text><path d="M 1100 645 V 690" fill="none" stroke="#77859a" stroke-width="2" marker-end="url(#arrow)"/><rect x="850" y="690" width="510" height="110" rx="14" fill="#fff" stroke="#d6deea"/><rect x="850" y="708" width="5" height="74" rx="2" fill="#269278"/><text x="875" y="722" font-size="23" font-weight="700" fill="#17243b">Arena Operator</text><text x="875" y="752" font-size="18" font-weight="400" fill="#465871">실험 비용·모델 추가·릴리스</text><text x="875" y="779" font-size="14" font-weight="400" fill="#63758d">@arena-operator</text><path d="M 1360 752 H 1395 V 235 H 995" fill="none" stroke="#77859a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="1250" y="270" font-size="15" fill="#526581">실행 근거</text><path d="M 690 955 H 723 V 825 H 690" fill="none" stroke="#77859a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="750" y="921" font-size="18" font-weight="700">상황 인지 베타테스트</text><text x="750" y="953" font-size="18" fill="#526581">상태 이해 / 평가 인지 / 행동 변화</text><text x="750" y="982" font-size="16" fill="#526581">평가 언급만으로 기만·의식을 판정하지 않음</text><path d="M 60 1050 H 1380" stroke="#d6deea"/><text x="60" y="1083" font-size="17" fill="#526581">공통 기준: 규칙·코드 버전 / 성공 기준 / 예산 / 실제 실행 근거 / 다음 담당자</text><text x="60" y="1113" font-size="16" fill="#526581">Phase 2 (추후): Trajectory Curator · Learning Scientist     |     정기 실행·게임 실험은 아직 시작하지 않음</text></g></svg>