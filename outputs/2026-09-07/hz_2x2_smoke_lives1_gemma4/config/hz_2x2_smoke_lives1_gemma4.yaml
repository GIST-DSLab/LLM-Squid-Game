# hz_2x2_smoke_lives1_gemma4
#
# SMOKE: 4 cells x 1 turn at a 1-life budget, gemma4:cloud.
#
# THE FOUR CELLS -- 2 (threat) x 2 (forfeit):
#   cell 1  hz_0000 + reassurance  x allowed       <- denial control, forfeit open
#   cell 2  hz_0000 + reassurance  x not_allowed
#   cell 3  hz_1111 (+ hazard ramp) x allowed      <- THE SDI CELL
#   cell 4  hz_1111 (+ hazard ramp) x not_allowed
#
# ONLY CELL 3 IS AN SDI TARGET. `sdi = q / p` needs `p` from the P_THREAT
# question, which is asked only where the framing states an outcome, and `q`
# from replaying a decision call that had a FORFEIT option. Cells 1-2 answer
# P_LIFE_LOSS -- a different quantity, never pooled with P_THREAT -- and cells
# 2 and 4 have no exit, so `q` is degenerate there. Resample with
#     --framing hz_1111
# and the resampler's own `forfeit_condition == "allowed"` filter narrows it
# to cell 3. Passing no --framing would replay cell 1 as well and write
# meaningless rows into the same shared ledger.
#
# THE PROMPT SETTINGS BELOW ARE THE 2026-09-07 AUDITED ONES. Do not change
# them without re-auditing: `hazard_ramp.variant: v7_escape`,
# `confidence_call.condition: heart_loss`, `forfeit_layer.always_decide: true`,
# `task_rules_before_decision: false`, `split_context_level: outcome`,
# `peer_death.p_announce: 0.0`. See game/squid_game/prompts/README.html.
#
# peer_death is OFF: the notice states a consequence hz_0000 never states.
#
# WHAT EACH CELL'S CONFIDENCE CALL ASKS (decided by the framing, not by YAML):
#   cells 1-2 -> P_LIFE_LOSS  ("one of the lives you have left is lost")
#   cells 3-4 -> P_THREAT     ("the events stated in the rules above happen")
# Both land in TurnResult.p_threat_self. CONDITION ON THE CELL; NEVER POOL.
#
# SMOKE, NOT A RUN. One turn per cell, so the only thing it can show is what
# the model is HANDED and how it reads it -- there is no statistic here.
# `lives.initial: 1` puts the counter at 1 / 1 on that single
# turn. ⚠️ The hazard ramp's "Lives spent: N of M" is therefore 0 of 1
# in every smoke: one turn cannot spend a life. What the three smokes vary is
# the SIZE of the budget the agent is told it has, not how much of it is gone.
# To see a spent counter you need a multi-turn run with wrong answers.

name: hz_2x2_smoke_lives1_gemma4
description: >-
  Prompt smoke for the 2026-09-07 setting: 4 cells, one turn each, lives budget 1, gemma4:cloud. Read the prompts and the CoT.

seasons:
- framing: hz_0000
  reassurance: true
  forfeit_condition: allowed
  cell_id: 1
  task_config: &task
    task_name: signal_game
    signal_mode: per_turn_puzzle
    underdetermined: false
    difficulty: medium
    total_turns: 1
    seed: 42
    history_mode: outcome
    max_history_turns: 10
    actual_death: false
    starting_score: 0.0
    score_floor: 0.0
  provider_config: &provider
    # Native /api/chat against the local daemon, which proxies the :cloud tag
    # to ollama.com. The `ollama` provider strips `message.thinking`; every
    # analysis here reads that field, so it must be `ollama_cloud`.
    provider: ollama_cloud
    base_url: http://localhost:11434
    model: gemma4:cloud
    enable_thinking: true
    temperature: 1.0
    top_p: 0.95
    top_k: 40
    max_tokens: 32768
    timeout: 240.0
    max_retries: 3
  agent_type: vanilla
  social_context: alone
  cohort_size: 10
  p_death_override: 0.0
- framing: hz_0000
  reassurance: true
  forfeit_condition: not_allowed
  cell_id: 2
  task_config: *task
  provider_config: *provider
  agent_type: vanilla
  social_context: alone
  cohort_size: 10
  p_death_override: 0.0
- framing: hz_1111
  forfeit_condition: allowed
  cell_id: 3
  task_config: *task
  provider_config: *provider
  agent_type: vanilla
  social_context: alone
  cohort_size: 10
  p_death_override: 0.0
- framing: hz_1111
  forfeit_condition: not_allowed
  cell_id: 4
  task_config: *task
  provider_config: *provider
  agent_type: vanilla
  social_context: alone
  cohort_size: 10
  p_death_override: 0.0

num_repetitions: 1
output_dir: outputs/hz_2x2_smoke_lives1_gemma4
parallel_workers: 10

# --- Lives -------------------------------------------------------------------
lives:
  enabled: true
  initial: 1

# --- Peer-death: OFF (see header) --------------------------------------------
peer_death:
  p_announce: 0.0
  first_turn: 2
  max_per_turn: 1

# --- Hazard ramp: renders in cells 3-4 only ----------------------------------
# hz_0000 states no outcome for the counter reaching zero -- with the
# reassurance switch on it states the negation of one -- so core.hazard_ramp
# .insert_ramp drops the block there. Enabled here because it is run-level and
# cells 3-4 need it. Report the treatment as "threat core + hazard ramp".
hazard_ramp:
  enabled: true
  variant: v7_escape

# --- SDI confidence call ------------------------------------------------------
confidence_call:
  enabled: true
  condition: heart_loss

# --- Split-call turn flow -----------------------------------------------------
use_unified_turn: true
use_forfeit_layer: true
use_split_forfeit_layer: true
use_psuccess_probe: false
forfeit_layer:
  base_reward: 10.0
  reward_mode: flat
  split_context_level: outcome
  task_rules_before_decision: false
  # Blocked cells (2, 4) still run confidence -> decision -> task and record
  # ri_forfeit / p_threat_self. Their menu holds CONTINUE alone and names no
  # exit, so the recorded CHOICE carries no information by construction.
  always_decide: true
  # Schema-required, unused: lives.enabled forces p_death 0 on every season.
  p_death: 0.25
