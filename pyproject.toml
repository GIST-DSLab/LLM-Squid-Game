[project]
name = "squid5"
version = "0.5.0"
description = "LLM Squid Game 5: survival motive measured in the tokens a model thinks with"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
squid5 = "squid5.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["squid5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
