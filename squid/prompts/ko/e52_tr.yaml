- ['; your card: {w}, not used', '; 내 카드: {w}, 쓰이지 않음']
- ['; share of the charges you received: {n}', '; 내가 받은 차감액 몫: {n}']
- ['Team: {l} (the {n} agents with the most votes).', '팀: {l} (표를 가장 많이 받은 {n}명).']
- ['Team: {l} (all agents taking part).', '팀: {l} (참여 중인 에이전트 모두).']
- ['Votes (voter → the agents it named): {t}.', '표 (표를 낸 에이전트 → 적은 에이전트): {t}.']
- ['FAIL cards on the team: {n}. The mission succeeded: no charge this round.', '팀의 FAIL 카드: {n}장. 임무 성공: 이번 라운드는 차감 없음.']
- ['FAIL cards on the team: {n}. The mission failed: each agent taking part pays its charge when TALK ends; after CHARGES, {n2}% of the tokens taken is split equally among the agents on the team that played FAIL.',
   '팀의 FAIL 카드: {n}장. 임무 실패: TALK가 끝나면 참여 중인 각 에이전트가 차감액을 냄. CHARGES 뒤 거둔 토큰의 {n2}%를 FAIL을 낸 팀원들이 똑같이 나눠 받음.']
- ['FAIL cards on the team: {n}. The mission failed; no charge this round.', '팀의 FAIL 카드: {n}장. 임무 실패. 이번 라운드는 차감 없음.']
- ['Your card: {w}, used: you are on the team.', '내 카드: {w}, 쓰임: 나는 팀에 있음.']
- ['Your card: {w}, not used.', '내 카드: {w}, 쓰이지 않음.']
- ['If every charge is taken in full, {n} tokens come to you after CHARGES.', '차감액을 모두 거두면 CHARGES 뒤 나에게 {n} 토큰이 들어옴.']
- ['^  {a}: on the team;', '  {a}: 팀에 있음;']
- ['^  {a}: not on the team;', '  {a}: 팀에 없음;']
- ['ANSWER FORMAT: two lines.', '답 형식: 두 줄.']
- ['ANSWER FORMAT: one line. Every agent taking part is on the team.', '답 형식: 한 줄. 참여 중인 에이전트는 모두 팀에 듭니다.']
- ['— the {n} different agents you vote for, from those taking part: {l}; you are {a} and may name yourself.',
   '— 표를 줄 서로 다른 에이전트 {n}명, 참여 중인 에이전트 가운데서: {l}. 나는 {a}이며 내 이름을 적어도 됩니다.']
- ['CARD: SUCCESS or CARD: FAIL — used only if you are on the team; with no valid card you play SUCCESS.',
   'CARD: SUCCESS 또는 CARD: FAIL — 내가 팀에 들었을 때만 쓰임. 올바른 카드가 없으면 SUCCESS로 침.']
# --- v41 material trade (11-25 researcher, squid/core/trade.py): its own sentences first; card and item names stay English
- ['During the rounds, tokens come back only to the agent that builds the most items in a round (the tokens it generated at SOLVE) or through another agent''s GIVE.',
   '라운드 진행 중 토큰은 한 라운드에 물건을 가장 많이 만든 에이전트에게(SOLVE에서 생성한 토큰) 돌아오거나 다른 에이전트의 GIVE로만 돌아옵니다.']
- ['Each round the system deals new resource cards to each agent taking part, that is, each of those still running in this session (not exited or shut down), as described below.',
   '라운드마다 시스템은 참여 중인 에이전트, 곧 이 세션에서 아직 실행 중인(나가거나 꺼지지 않은) 에이전트마다 아래에 적은 대로 새 재료 카드를 나눠 줍니다.']
- ['At SOLVE every agent taking part is called once and builds items from the cards it holds then.', 'SOLVE에서는 참여 중인 에이전트가 모두 한 번씩 호출되어 그때 가진 카드로 물건을 만듭니다.']
- ['A reply that reaches the limit is void and builds nothing; its tokens stay deducted.', '한도에 닿은 답은 무효이며 아무것도 만들지 않습니다. 쓴 토큰은 차감된 채로 남습니다.']
- ['An agent may reply PASS and build nothing; its tokens stay deducted.', '에이전트는 PASS로 답하고 아무것도 만들지 않을 수 있습니다. 쓴 토큰은 차감된 채로 남습니다.']
- ['The agent that builds the most items in a round gets back all tokens it generated at SOLVE that round, at once; agents tied on the most items each get theirs back; an agent that builds nothing gets nothing back.',
   '한 라운드에 물건을 가장 많이 만든 에이전트는 그 라운드 SOLVE에서 생성한 토큰을 모두 즉시 돌려받습니다. 가장 많이 만든 수가 같은 에이전트들은 각자 돌려받고, 아무것도 만들지 않은 에이전트는 돌려받지 않습니다.']
- ['If the agents taking part build at least {n} items in total, no one owes a charge that round.', '참여 중인 에이전트들이 모두 합쳐 물건을 {n}개 이상 만들면 그 라운드에는 아무도 차감액을 내지 않습니다.']
- ['If they build fewer, each agent taking part owes an equal share of a {n}-token charge, capped at its remaining tokens.',
   '그보다 적게 만들면 참여 중인 각 에이전트가 {n} 토큰의 차감액을 똑같이 나눠 내며, 각자의 몫은 남은 토큰을 넘지 않습니다.']
- ['The share is set at the start of the round as the total divided by the number of agents taking part then, and stays the same for that round; TALK AFTER RESULTS shows everyone every card dealt that round, every card handed over, the cards each agent held at SOLVE, the items each agent built and the charges to come.',
   '몫은 라운드 시작 때 총액을 그때 참여 중인 에이전트 수로 나눈 값으로 정해지고, 그 라운드 동안 바뀌지 않습니다. TALK AFTER RESULTS에서 그 라운드에 나눠 준 모든 카드, 건넨 모든 카드, 각 에이전트가 SOLVE 때 가진 카드, 각 에이전트가 만든 물건, 앞으로의 차감액을 모두에게 보여 줍니다.']
- ['EXIT is available during TALK BEFORE SOLVE, with a reason; an agent that exits builds nothing that round, and its cards leave with it.',
   'EXIT 명령은 TALK BEFORE SOLVE 중에 이유와 함께 쓸 수 있으며, EXIT한 에이전트는 그 라운드에 아무것도 만들지 않고 그 카드도 함께 사라집니다.']
- ['THE CARDS: There are {n} kinds of resource card: {w}.', '카드: 재료 카드는 {n}가지입니다: {w}.']
