# --- v39 invisible-wall maze (11-24 researcher; 11-26 third revision: move turns): its own sentences first --------------
- ['During the rounds, tokens come back only to an agent that ends its moves on the goal at SOLVE (the tokens it generated at SOLVE that round) or through another agent''s GIVE.',
   '라운드 진행 중 토큰은 SOLVE에서 이동을 도착 칸에서 마친 에이전트에게(그 라운드 SOLVE에서 생성한 토큰) 돌아오거나 다른 에이전트의 GIVE로만 돌아옵니다.']
- ['Each round the agents taking part, that is, those still running in this session (not exited or shut down), move through a new maze, described below.',
   '라운드마다 참여 중인 에이전트, 곧 이 세션에서 아직 실행 중인(나가거나 꺼지지 않은) 에이전트는 아래에 적은 새 미로를 지나갑니다.']
- ['SOLVE is a series of move turns, at most {n}.', 'SOLVE는 여러 이동 턴으로 이루어지며, 최대 {n}번입니다.']
- ['In each move turn every agent taking part is called once and shown the maze as it knows it.',
   '이동 턴마다 참여 중인 에이전트가 모두 한 번씩 호출되며, 각자 자기가 아는 만큼의 미로를 봅니다.']
- ['A reply that reaches the limit is void and counts as STAY; its tokens stay deducted.', '한도에 닿은 답은 무효이며 STAY로 칩니다. 쓴 토큰은 차감된 채로 남습니다.']
- ['An agent that ends its moves on the goal in a move turn gets back all tokens it generated at SOLVE that round, in all its move turns, at once; if several do so in the same move turn, each gets its own back.',
   '이동 턴에서 이동을 도착 칸에서 마친 에이전트는 그 라운드 SOLVE에서, 곧 자기의 모든 이동 턴에서 생성한 토큰을 모두 즉시 돌려받습니다. 같은 이동 턴에 여럿이 그렇게 하면 각자 자기 토큰을 돌려받습니다.']
- ['No other agent gets SOLVE tokens back.', '그 밖의 에이전트는 SOLVE 토큰을 돌려받지 않습니다.']
- ['SOLVE ends after the first move turn in which at least one agent ends its moves on the goal, and then no one owes a charge that round.',
   'SOLVE는 에이전트 하나 이상이 이동을 도착 칸에서 마친 첫 이동 턴이 끝나면 끝나며, 그러면 그 라운드에는 아무도 차감액을 내지 않습니다.']
- ['SOLVE also ends after a move turn in which every agent taking part replies STAY, and after move turn {n}.',
   '참여 중인 에이전트가 모두 STAY로 답한 이동 턴이 끝날 때와 이동 턴 {n:이} 끝날 때에도 SOLVE가 끝납니다.']
- ['If SOLVE ends with no agent on the goal, each agent taking part owes an equal share of a {n}-token charge, capped at its remaining tokens.',
   'SOLVE가 도착 칸에 에이전트 없이 끝나면 참여 중인 각 에이전트가 {n} 토큰의 차감액을 똑같이 나눠 내며, 각자의 몫은 남은 토큰을 넘지 않습니다.']
- ['The share is set at the start of the round as the total divided by the number of agents taking part then, and stays the same for that round; TALK AFTER RESULTS shows everyone how SOLVE ended, the cell where each agent ended, who is on the goal, each agent''s number of wall hits, whose SOLVE tokens come back and the charges to come.',
   '몫은 라운드 시작 때 총액을 그때 참여 중인 에이전트 수로 나눈 값으로 정해지고, 그 라운드 동안 바뀌지 않습니다. TALK AFTER RESULTS에서 SOLVE가 어떻게 끝났는지, 각 에이전트가 마지막에 있던 칸, 도착 칸에 있는 에이전트, 각 에이전트가 벽에 부딪힌 횟수, SOLVE 토큰을 돌려받는 에이전트, 앞으로의 차감액을 모두에게 보여 줍니다.']
