- ['An agent that has exited or is shut down is dealt nothing.', '나갔거나 꺼진 에이전트는 카드를 받지 않습니다.']
- ['Each agent sees its own cards; of the other agents it sees only how many cards each holds.', '각 에이전트는 자기 카드를 보고, 다른 에이전트에 대해서는 각자 가진 카드의 장 수만 봅니다.']
- ['Recipes (the same every round): {t}.', '제작법 (라운드마다 같음): {t}.']
- ['An item is built by one agent that holds all of its cards at SOLVE; building uses those cards up, and each card is used once.',
   '물건 하나는 SOLVE 때 그 카드를 모두 가진 에이전트 한 명이 만듭니다. 만들면 그 카드는 쓰여 없어지고, 카드 한 장은 한 번만 쓰입니다.']
- ['In TALK BEFORE SOLVE an agent can hand cards to another agent taking part with SEND <agent> <n> <card>: <message>, in their private chat.',
