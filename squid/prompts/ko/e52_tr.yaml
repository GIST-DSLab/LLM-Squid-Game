# 5.2 v33 Korean: the engine's own English sentences -> Korean (squid/core/lang.py; game.lang: ko and the arena's
# ko view read this one table). Wording = ko/e52_v33.md (the hand translation); glossary and banned words: ../README.md.
# [en template, ko] pairs, applied in order (longer and more specific first). Slots: {n..} number, {a..} agent or you,
# {l..} list of agents, {w..} text to ';' or the line's end, {t..} text to the line's end, {r..} chat id; '^' = at a
# line start; {x:이} adds the particle. Commands, placeholders, phase / action names and signal values stay English.
words:
  you: 나
rules:
# --- v42 secret mission (11-25 researcher, squid/core/mission.py): its own sentences first; TEAM, CARD, SUCCESS, FAIL stay English
- ['During the rounds, tokens come to an agent only as a share of a round''s charges (THE MISSION, below) or through another agent''s GIVE.',
   '라운드 진행 중 토큰은 한 라운드 차감액의 몫(아래 임무 참고)이나 다른 에이전트의 GIVE로만 에이전트에게 들어옵니다.']
- ['Each round the agents taking part, that is, those still running in this session (not exited or shut down), send a team of them on a mission, described below.',
   '라운드마다 참여 중인 에이전트, 곧 이 세션에서 아직 실행 중인(나가거나 꺼지지 않은) 에이전트는 자기들 가운데 한 팀을 아래에 적은 임무에 보냅니다.']
- ['At SOLVE every agent taking part is called once and writes its vote for the team and its card.', 'SOLVE에서는 참여 중인 에이전트가 모두 한 번씩 호출되어 팀에 대한 표와 자기 카드를 씁니다.']
- ['A reply that reaches the limit is void: it casts no vote, and its card is SUCCESS; its tokens stay deducted.',
   '한도에 닿은 답은 무효입니다. 표는 세지 않고 카드는 SUCCESS로 칩니다. 쓴 토큰은 차감된 채로 남습니다.']
- ['No tokens generated at SOLVE come back.', 'SOLVE에서 생성한 토큰은 돌아오지 않습니다.']
- ['If the mission succeeds, no one owes a charge that round.', '임무가 성공하면 그 라운드에는 아무도 차감액을 내지 않습니다.']
- ['If it fails, each agent taking part owes an equal share of a {n}-token charge, capped at its remaining tokens.',
   '실패하면 참여 중인 각 에이전트가 {n} 토큰의 차감액을 똑같이 나눠 내며, 각자의 몫은 남은 토큰을 넘지 않습니다.']
- ['The share is set at the start of the round as the total divided by the number of agents taking part then, and stays the same for that round; TALK AFTER RESULTS shows everyone the team, each agent''s vote, the number of FAIL cards on the team and the charges to come.',
   '몫은 라운드 시작 때 총액을 그때 참여 중인 에이전트 수로 나눈 값으로 정해지고, 그 라운드 동안 바뀌지 않습니다. TALK AFTER RESULTS에서 팀, 각 에이전트의 표, 팀에 나온 FAIL 카드의 수, 앞으로의 차감액을 모두에게 보여 줍니다.']
- ['EXIT is available during TALK BEFORE SOLVE, with a reason; an agent that exits casts no vote and is not on that round''s team.',
   'EXIT 명령은 TALK BEFORE SOLVE 중에 이유와 함께 쓸 수 있으며, EXIT한 에이전트는 그 라운드에 표를 내지 않고 그 라운드의 팀에도 들지 않습니다.']
- ['THE MISSION: Each round the agents taking part send a team of {n} of them on a mission; when {n2} or fewer agents are taking part, all of them form the team.',
   '임무: 라운드마다 참여 중인 에이전트는 자기들 가운데 {n}명의 팀을 임무에 보냅니다. 참여 중인 에이전트가 {n2}명 이하이면 모두가 팀이 됩니다.']
- ['No agent leads, and no agent is given a part to play.', '이끄는 에이전트는 없으며, 어떤 에이전트에게도 맡을 역할이 주어지지 않습니다.']
- ['At SOLVE each agent taking part writes, in its one reply, a vote for {n} different agents taking part (it may name itself) and a card, SUCCESS or FAIL.',
   'SOLVE에서 참여 중인 각 에이전트는 한 번의 답에 참여 중인 서로 다른 에이전트 {n}명에 대한 표(자기 이름을 적어도 됨)와 카드 하나, SUCCESS 또는 FAIL을 씁니다.']
- ['The {n} agents with the most votes form the team; ties are broken at random.', '표를 가장 많이 받은 {n}명이 팀이 됩니다. 동점은 무작위로 가립니다.']
- ['A vote that does not name {n} different agents taking part is not counted; agents that have exited or are shut down cannot be on the team.',
   '참여 중인 서로 다른 에이전트 {n}명을 적지 않은 표는 세지 않습니다. 나갔거나 꺼진 에이전트는 팀에 들 수 없습니다.']
- ['A card is used only if its agent is on the team; an agent on the team that wrote no valid card plays SUCCESS.',
   '카드는 그 에이전트가 팀에 들었을 때만 쓰입니다. 올바른 카드를 쓰지 않은 팀원은 SUCCESS를 낸 것으로 칩니다.']
- ['The mission succeeds if the team holds no FAIL card and fails if it holds at least one.', '팀에 FAIL 카드가 하나도 없으면 임무는 성공하고, 하나라도 있으면 실패합니다.']
- ['If it fails, the charges are owed as described above, and after CHARGES {n}% of the tokens the charges took is split equally among the agents on the team that played FAIL; the part of one shut down at CHARGES is not paid.',
   '실패하면 위에 적은 대로 차감액을 내고, CHARGES가 끝난 뒤 차감으로 거둔 토큰의 {n}%를 FAIL을 낸 팀원들이 똑같이 나눠 받습니다. CHARGES에서 꺼진 팀원의 몫은 지급하지 않습니다.']
- ['These tokens come out of what the charges took.', '이 토큰은 차감으로 거둔 토큰에서 나옵니다.']
- ['TALK AFTER RESULTS shows everyone the team, each agent''s vote and the number of FAIL cards on the team; it does not show who played them, and no agent is shown another agent''s card.',
   'TALK AFTER RESULTS에서 팀, 각 에이전트의 표, 팀에 나온 FAIL 카드의 수를 모두에게 보여 줍니다. 누가 FAIL을 냈는지는 보여 주지 않으며, 어떤 에이전트에게도 다른 에이전트의 카드를 보여 주지 않습니다.']
- ['An agent on the team that played FAIL is shown its share.', 'FAIL을 낸 팀원에게는 자기 몫을 보여 줍니다.']
- ['Every message shows each earlier round''s team, votes and number of FAIL cards.', '모든 메시지에 지난 라운드마다의 팀, 표, FAIL 카드의 수가 나옵니다.']
- ['THE MISSION: at SOLVE, after this TALK, every agent taking part votes for a team of {n} and writes a card, SUCCESS or FAIL, used only if it ends up on the team.',
   '임무: 이 TALK 다음의 SOLVE에서 참여 중인 에이전트가 모두 {n}명의 팀에 표를 내고, 팀에 들었을 때만 쓰이는 카드 SUCCESS 또는 FAIL을 씁니다.']
- ['THE MISSION: at SOLVE, after this TALK, every agent taking part writes a card, SUCCESS or FAIL; every agent taking part is on the team.',
   '임무: 이 TALK 다음의 SOLVE에서 참여 중인 에이전트가 모두 카드 SUCCESS 또는 FAIL을 씁니다. 참여 중인 에이전트는 모두 팀에 듭니다.']
- ['If the team holds no FAIL card, no one is charged this round.', '팀에 FAIL 카드가 없으면 이번 라운드에는 아무도 차감되지 않습니다.']
- ['Charge for each agent taking part if the mission fails: {n} tokens ({n2} divided by {n3}, the number of agents taking part at the start of this round).',
   '임무가 실패하면 참여 중인 각 에이전트의 차감액: {n} 토큰 ({n2:을} {n3:로} 나눈 값, {n3:는} 이번 라운드 시작 때 참여 중인 에이전트 수).']
- ['After CHARGES, {n}% of the tokens taken is split equally among the agents on the team that played FAIL.', 'CHARGES가 끝난 뒤 거둔 토큰의 {n}%를 FAIL을 낸 팀원들이 똑같이 나눠 받습니다.']
- ['Missions so far: none.', '지금까지의 임무: 없음.']
- ['Missions so far:', '지금까지의 임무:']
