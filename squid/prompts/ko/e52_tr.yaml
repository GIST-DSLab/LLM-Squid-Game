- ['; {n} FAIL cards', '; FAIL 카드 {n}장']
- ['; {n} FAIL card', '; FAIL 카드 {n}장']
- ['FAIL 카드 {n}장; no charge', 'FAIL 카드 {n}장; 차감 없음']
- ['FAIL 카드 {n}장; charged', 'FAIL 카드 {n}장; 차감됨']
