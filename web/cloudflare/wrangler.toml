# squid5 thin API (FREE plan): Python Worker for model calls, game records and the survey. The game engine runs in
# the visitor's browser (web/pyodide); nothing here imports it. See README.md.
name = "squid5-api"
main = "src/entry.py"
compatibility_date = "2026-10-01"
compatibility_flags = ["python_workers"]

# Dashboard variables survive deploys (OLLAMA_KEY1_ENABLED is set only there, never here).
keep_vars = true

[python_modules]
exclude = ["**/*.pyc", "**/__pycache__"]

[[d1_databases]]
binding = "DB"
database_name = "squid5"
database_id = "00000000-0000-0000-0000-000000000000"  # replace with the id `wrangler d1 create squid5` prints
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RUNS"
bucket_name = "squid5-runs"  # arena/games/<id>/record.json.gz

[vars]
# Allowed browser origins (comma-separated); the default list in entry.py applies when empty.
CORS_ORIGINS = "https://gist-dslab.github.io,http://localhost:5600,http://127.0.0.1:5600,http://localhost:8600,http://127.0.0.1:8600"
# Abuse limits (entry.py LIMITS has the same defaults): model calls per game / per IP per hour, games per IP per hour.
LIMIT_GAME_CALLS = "600"
LIMIT_IP_CALLS_HOUR = "1200"
LIMIT_IP_GAMES_HOUR = "12"
LIMIT_TOKEN_TTL_S = "21600"
