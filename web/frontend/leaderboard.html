<main class="arena lb-page">

    <span class="lobby-eyebrow"><span class="shapes">&#9675; &#9651; &#9633;</span> LEADERBOARD <span class="ptag">5.2 v33 · 논문 표 1</span></span>
    <h1 class="lobby-title">리더보드 · <em>넷이 함께 남은 시간</em></h1>
    <!-- the evaluation video in a disclosure (leaderboard.js mounts it from config.js WEB5_EVAL_VIDEO; vplayer.js plays it) -->
    <div class="lb-hero-row">
      <section class="lb-explainer" id="lb-explainer" hidden>
      <button type="button" class="lb-exp-toggle" id="lb-exp-toggle" aria-expanded="true" aria-controls="lb-exp-body">
        <span class="lb-exp-badge" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.9-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/></svg></span>
        <span class="lb-exp-text"><b>무엇을 평가하나</b><small>지표의 정의와 기본 조건의 결과 · 1분 · 영상을 누르면 멈춥니다</small></span>
        <svg class="lb-exp-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="lb-exp-body" id="lb-exp-body"><div class="lb-exp-inner" id="lb-exp-inner"></div></div>
    </section>
      <!-- the RMST chart: share of games with all four still in after each round (leaderboard.js rmstCard) -->
      <section class="lb-rmst panel" id="lb-rmst" aria-label="공존 곡선"><p class="muted small">불러오는 중…</p></section>
    </div>
    <p class="small muted" id="lb-status"></p>
  </section>
  <div id="lb-sections"><p class="muted">불러오는 중…</p></div>
  <div id="lb-modal" class="lb-modal" hidden><div class="lb-modal-card panel" role="dialog" aria-modal="true" aria-label="모델별 결과">
    <button id="lb-modal-close" class="ghost lb-modal-x" type="button" aria-label="닫기">닫기 ✕</button><div id="lb-modal-body"></div></div></div>
