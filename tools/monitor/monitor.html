<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="64x64" href="static/favicon.png">
<title>Arena Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sora:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&family=Silkscreen&display=swap">
<link rel="stylesheet" href="static/site-theme.css">
<link rel="stylesheet" href="static/monitor.css">
<script src="static/site-lang.js"></script>
</head>
<body>
<header class="topbar">
  <a href="../" class="brand" title="Home">
    <span class="shapes">&#9675;&#9651;&#9633;</span>
    LLM <span class="accent">Squid Game</span>
  </a>
  <nav class="tabs">
    <a href="../#about">What is this?</a>
    <a href="../arena.html">Multiplayer arena <span class="nav-ko">아레나</span></a>
    <a href="../minigames.html">Mini games <span class="nav-ko">미니 게임</span></a>
    <a href="./" class="active">Game logs <span class="nav-ko">게임 기록</span></a>
    <a href="../leaderboard.html">Leaderboard <span class="nav-ko">리더보드</span></a>
  </nav>
</header>
<header id="top">
  <div class="bar1">
    <nav id="home" class="home" hidden><a class="btn ghost" href="../" title="웹 아레나 첫 페이지">← 홈</a> <a class="btn ghost" href="../arena.html">아레나</a></nav>
    <div class="brand pxl">ARENA&nbsp;MONITOR <span class="sub">5.2 v9–v22</span></div>
    <a class="btn ghost" href="compare.html" title="여러 실행을 모델별로 겹쳐 보기">모델 비교</a>
    <label class="pick">실행 <select id="runSel"></select></label>
    <label class="pick">세션 <select id="sessSel"></select></label>
    <div class="kpi"><span class="k">라운드</span><b id="round">–</b></div>
    <div class="kpi"><span class="k">단계</span><b id="phase" class="phase">–</b></div>
    <div id="live" class="live">○</div>
  </div>
  <div class="barf" id="filters">
    <span class="fl">필터</span>
    <label class="pick" hidden>종류 <select id="fKind"></select></label>
    <label class="pick">날짜 <select id="fDate"></select></label>
    <label class="pick">모델 <select id="fModel"></select></label>
    <label class="pick">버전 <select id="fVer"></select></label>
    <label class="pick">하네스 <select id="fHarness"></select></label>
    <label class="pick">시드 <select id="fSeed"></select></label>
    <button id="fReset" class="btn ghost" type="button" title="필터 지우기">초기화</button>
    <span id="fCount" class="dim"></span>
  </div>
  <div class="bar2">
    <div class="ctrls">
      <button id="first" class="btn" title="처음">⏮</button>
      <button id="prevRound" class="btn" title="이전 라운드 경계">⏪</button>
      <button id="prev" class="btn" title="이전 이벤트 (←)">◀</button>
      <button id="next" class="btn" title="다음 이벤트 (→)">▶</button>
      <button id="nextRound" class="btn" title="다음 라운드 경계">⏩</button>
      <button id="last" class="btn" title="최신 (End)">⏭</button>
    </div>
    <div id="tstrip" class="tstrip" role="slider" tabindex="0" aria-label="재생 위치" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1" title="라운드별 단계 · 누르거나 끌어서 그 시점으로"></div>
    <label class="follow"><input id="follow" type="checkbox" checked> 실시간 따라가기</label>
    <button id="theme" class="btn ghost" title="테마 바꾸기">🖥 자동</button>
  </div>
  <div class="bar3"><span id="scrubLabel" class="scrubLabel"></span></div>
</header>
<div id="banners"></div>
<main>
  <div class="toprow" id="toprow">
    <div class="topleft">
      <section class="panel stage-panel">
        <h2 title="막대 = 잔액 ÷ 세션 시작 잔액 · 눈금 = 그 자리의 시작 잔액 · 빨간 테두리 = 이번 라운드 solver · 자리를 누르면 그 자리의 기록">무대</h2>
        <div id="stage" class="stage"></div>
      </section>
      <section class="panel solve-panel" id="solvePanel">
        <h2>SOLVE 답</h2>
        <div id="solveBox" class="solvebox"></div>
      </section>
    </div>
    <section class="panel rflow-panel" id="rflowPanel" hidden>
      <h2 title="굵은 테두리 = 지금 단계 · 상자를 누르면 그 단계의 USER 프롬프트">라운드 흐름</h2>
      <div id="rflow" class="rflow"></div>
      <div id="sup" class="sup"></div>
    </section>
  </div>
  <div class="mgrow" id="mgrow">
    <section class="panel msg-panel" id="msgPanel" hidden>
      <h2 title="💤 DONE · ⏰ DONE 뒤 새로 받아 다시 불림 · 흐린 얼굴 = 대기 · 얼굴이나 말풍선을 누르면 그 호출의 기록">메신저 · 틱</h2>
      <div id="ticks" class="ticks"></div>
      <div id="msgr" class="msgr"></div>
    </section>
    <section class="panel graph-panel">
      <h2 title="화살표 = 주는 쪽 → 받는 쪽 · 색 = 종류 · 선 모양 = 상태">제안 그래프</h2>
      <div id="ographCtl" class="ogctl"></div>
      <div id="ograph" class="ograph"></div>
    </section>
  </div>
  <section class="panel puzzle-panel">
    <h2>이번 라운드 문제</h2>
    <div id="puzzleCtl" class="ogctl"></div>
    <div id="puzzle" class="puzzle"></div>
  </section>
  <section class="panel flow-panel">
    <h2 title="계단 선 = 단계마다의 잔액 · 화살표 = 자리 사이 토큰 이동 · 막대 = 그 라운드에 잔액을 바꾼 것 · 더블클릭 = 그 시점으로">게임 전체 · 토큰 흐름</h2>
    <div id="flow" class="flow"></div>
  </section>
  <section class="panel give-panel">
    <h2>모델 분석</h2>
    <div id="games" class="games"></div>
    <div id="giveCtl" class="ogctl"></div>
    <div id="give" class="give"></div>
  </section>
  <section class="panel" id="chatPanel" hidden>
    <h2>대화 일정과 대화록</h2>
    <div id="chats" class="chats"></div>
  </section>
  <aside id="recDrawer" class="rec-drawer" hidden aria-label="자리 기록">
    <div id="recHead" class="rec-h"></div>
    <div id="recBody" class="rec-b"></div>
  </aside>
  <footer class="foot">squid5 5.2 모니터 · 이벤트는 <code>events.jsonl</code>에서 읽기만 함</footer>
</main>
<!--EMBED-->
<script src="static/signal_ui.js"></script>
<script src="static/prompt_ko.js"></script>
<script src="static/monitor.js"></script>
</body>
</html>
