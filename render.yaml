# Render Blueprint for the squid5 web5 API (copy of web/deploy/render.yaml).
services:
  - type: web
    name: squid5-web5-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: web/deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: WEB5_DSN
        sync: false        # Postgres URI (Supabase); unset -> SQLite on the ephemeral disk
      - key: WEB5_CORS_ORIGINS
        sync: false        # e.g. https://gist-dslab.github.io
